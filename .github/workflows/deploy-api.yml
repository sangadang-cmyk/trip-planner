name: Deploy to ECR & ECS

on:
  push:
    tags:
      - 'dev-*'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: development
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          role-to-assume: arn:aws:iam::379687261364:role/GitHubActions_TripPlanner
          aws-region: us-east-1
          audience: 'sts.amazonaws.com'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update deployment version
        run: |
          sed -i "s/deployment-version: .*/deployment-version: ${GITHUB_REF_NAME}/" src/main/resources/application.yml

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          chmod +x ./mvnw
          ./mvnw spring-boot:build-image \
            -ntp \
            -DskipTests=true \
            -Dspring-boot.build-image.imageName=$IMAGE \
            -Dspring-boot.build-image.buildpacks=paketo-buildpacks/java:10.19.0
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Main
          image: ${{ env.IMAGE }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true